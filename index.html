<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Social links profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: hsl(0, 0%, 8%);
      margin: 0;
      padding: 1rem;
      min-height: 100vh;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: hsl(0, 0%, 12%);
      border-radius: 12px;
      padding: 2.5rem 2.25rem;
      width: 100%;
      max-width: 346px;
      margin: auto;
      box-sizing: border-box;
    }

    .card section {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    img.avatar {
      display: block;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 1.5rem;
      margin: 0 0 0.5rem;
      color: hsl(0, 0%, 100%);
      font-weight: 600;
      text-align: center;
    }

    .hero {
      font-size: 14px;
      margin: 0 0 1.5rem;
      color: hsl(75, 94%, 57%);
      font-weight: 600;
      text-align: center;
    }

    .quote {
      font-size: 14px;
      margin: 0 0 1.5rem;
      color: hsl(0, 0%, 100%);
      font-weight: 400;
      text-align: center;
    }

    .card1 {
      width: 100%;
      box-sizing: border-box;
      font-size: 14px;
      color: hsl(0, 0%, 100%);
      font-weight: 700;
      background-color: hsl(0, 0%, 20%);
      border-radius: 8px;
      padding: 0.75rem 0;
      margin: 0 0 1rem;
      text-align: center;
    }

    .attribution {
      font-size: 0.6875rem;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>
</head>

<body>
  <article class="card">
    <section>

      <img class="avatar" src="./assets/images/avatar-jessica.jpeg" alt="Jessica Randall">
      <h1>Jessica Randall</h1>
      <p class="hero">London, United Kingdom</p>

      <p class="quote">"Front-end developer and avid reader."</p>

      <p class="card1">GitHub</p>
      <p class="card1">Frontend Mentor</p>
      <p class="card1">LinkedIn</p>
      <p class="card1">Twitter</p>
      <p class="card1">Instagram</p>

    </section>
  </article>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="https://www.github.com/mishaelanyoka1-droid">Mishael Anyoka</a>.
  </footer>
</body>

</html>
